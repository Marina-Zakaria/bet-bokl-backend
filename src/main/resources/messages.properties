# ── messages.properties — English (default) ──────────────────────────────────
#
# This file is the fallback for ALL languages.
# If a key is missing from a language-specific file, Spring returns the value here.
#
# Naming convention:  {domain}.{action}.{result}
#   auth.register.otp_sent    → auth domain, register action, otp sent result
#   booking.cancel.success    → booking domain, cancel action, success result
#   error.body.malformed      → generic HTTP error
#
# Arguments: use MessageFormat positional syntax {0}, {1}, ...
#   error.route.not_found=No handler found for {0} {1}
#   → msg.get("error.route.not_found", "GET", "/unknown")
#   → "No handler found for GET /unknown"
#
# IMPORTANT: Every key added here must also be added to every language-specific
# file (messages_ar.properties, etc.). A missing key in a language file causes
# Spring to fall back to this file — which is intentional — but untranslated keys
# should still be tracked for completeness.
# ─────────────────────────────────────────────────────────────────────────────

# ── Generic HTTP errors ───────────────────────────────────────────────────────
# Note: single quotes in MessageFormat patterns must be escaped as ''
error.body.malformed=Malformed or unreadable request body
error.route.not_found=No handler found for {0} {1}
error.method.not_supported=Request method ''{0}'' is not supported
error.media_type.not_supported=Content-Type not supported
error.governorate.not_found=Governorate {0} not found
error.internal=An unexpected error occurred

