# application-prod.properties — PRODUCTION profile
# Active when: SPRING_PROFILES_ACTIVE=prod
#
# SECURITY RULES:
#   - No credential defaults — missing env var = startup crash (intentional)
#   - ddl-auto=validate — Hibernate never touches the schema
#   - Stack traces never returned in HTTP error responses

# ── DataSource — all values from environment variables, no defaults ──
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────
# Liquibase owns the schema — Hibernate must not attempt DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Logging ───────────────────────────────────────────────
logging.level.root=INFO

# ── Error responses — hide internals from clients ─────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── Actuator — expose only health externally ──────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
