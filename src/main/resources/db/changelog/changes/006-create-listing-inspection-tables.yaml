databaseChangeLog:
  - changeSet:
      id: 006-create-listing-inspection-tables
      author: home-rental-service
      changes:
        - createTable:
            tableName: inspection_elements
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: element_key
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: element_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: is_required
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: label_ar
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: label_en
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: placeholder
                  type: varchar(255)
              - column:
                  name: min_value
                  type: decimal(10,2)
              - column:
                  name: max_value
                  type: decimal(10,2)
              - column:
                  name: options_json
                  type: json
              - column:
                  name: sort_order
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: street_address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: building_number
                  type: varchar(50)
              - column:
                  name: apartment_number
                  type: varchar(50)
              - column:
                  name: landmark
                  type: varchar(255)
              - column:
                  name: latitude
                  type: decimal(10,8)
              - column:
                  name: longitude
                  type: decimal(11,8)
              - column:
                  name: google_place_id
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: property_details
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: address_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: governorate_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: area_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: rooms_count
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: area_sqm
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: furnishing
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: expected_rent
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: amenities
                  type: json
              - column:
                  name: photos
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: property_applications
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: property_detail_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: inspector_id
                  type: bigint
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: admin_comments
                  type: text
              - column:
                  name: inspector_assigned_at
                  type: timestamp
              - column:
                  name: submitted_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: inspection_schedules
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: application_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: proposed_start
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: proposed_end
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: exact_time
                  type: timestamp
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: 'PROPOSED'
              - column:
                  name: selection_order
                  type: int
              - column:
                  name: confirmed_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: inspection_reports
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: schedule_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: inspector_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: property_detail_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: recommendation
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: agreed_rent
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: report_data
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: evidence_photos
                  type: json
              - column:
                  name: comments
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: admin_decisions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: application_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: admin_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: report_id
                  type: bigint
              - column:
                  name: decision
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: final_rent
                  type: decimal(10,2)
              - column:
                  name: comments
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: listings
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: property_detail_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: application_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: decision_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: final_rent
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: 'ACTIVE'
              - column:
                  name: activated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: terms_definitions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: version
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: title_ar
                  type: varchar(255)
              - column:
                  name: title_en
                  type: varchar(255)
              - column:
                  name: content_ar
                  type: text
              - column:
                  name: content_en
                  type: text
              - column:
                  name: effective_at
                  type: timestamp
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
        - createTable:
            tableName: terms_consents
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: application_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: terms_definition_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: agreed_rent
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: commission_percentage
                  type: decimal(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: accepted_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: ip_address
                  type: varchar(45)
              - column:
                  name: user_agent
                  type: text
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: title_ar
                  type: varchar(255)
              - column:
                  name: title_en
                  type: varchar(255)
              - column:
                  name: body_ar
                  type: text
              - column:
                  name: body_en
                  type: text
              - column:
                  name: data
                  type: json
              - column:
                  name: is_read
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: property_details
            baseColumnNames: address_id
            referencedTableName: addresses
            referencedColumnNames: id
            constraintName: fk_property_details_address
        - addForeignKeyConstraint:
            baseTableName: property_details
            baseColumnNames: governorate_id
            referencedTableName: governorates
            referencedColumnNames: id
            constraintName: fk_property_details_governorate
        - addForeignKeyConstraint:
            baseTableName: property_details
            baseColumnNames: area_id
            referencedTableName: areas
            referencedColumnNames: id
            constraintName: fk_property_details_area
        - addForeignKeyConstraint:
            baseTableName: property_applications
            baseColumnNames: user_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_property_applications_user
        - addForeignKeyConstraint:
            baseTableName: property_applications
            baseColumnNames: property_detail_id
            referencedTableName: property_details
            referencedColumnNames: id
            constraintName: fk_property_applications_property_detail
        - addForeignKeyConstraint:
            baseTableName: property_applications
            baseColumnNames: inspector_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_property_applications_inspector
        - addForeignKeyConstraint:
            baseTableName: inspection_schedules
            baseColumnNames: application_id
            referencedTableName: property_applications
            referencedColumnNames: id
            constraintName: fk_inspection_schedules_application
        - addForeignKeyConstraint:
            baseTableName: inspection_reports
            baseColumnNames: schedule_id
            referencedTableName: inspection_schedules
            referencedColumnNames: id
            constraintName: fk_inspection_reports_schedule
        - addForeignKeyConstraint:
            baseTableName: inspection_reports
            baseColumnNames: inspector_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_inspection_reports_inspector
        - addForeignKeyConstraint:
            baseTableName: inspection_reports
            baseColumnNames: property_detail_id
            referencedTableName: property_details
            referencedColumnNames: id
            constraintName: fk_inspection_reports_property_detail
        - addForeignKeyConstraint:
            baseTableName: admin_decisions
            baseColumnNames: application_id
            referencedTableName: property_applications
            referencedColumnNames: id
            constraintName: fk_admin_decisions_application
        - addForeignKeyConstraint:
            baseTableName: admin_decisions
            baseColumnNames: admin_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_admin_decisions_admin
        - addForeignKeyConstraint:
            baseTableName: admin_decisions
            baseColumnNames: report_id
            referencedTableName: inspection_reports
            referencedColumnNames: id
            constraintName: fk_admin_decisions_report
        - addForeignKeyConstraint:
            baseTableName: listings
            baseColumnNames: property_detail_id
            referencedTableName: property_details
            referencedColumnNames: id
            constraintName: fk_listings_property_detail
        - addForeignKeyConstraint:
            baseTableName: listings
            baseColumnNames: owner_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_listings_owner
        - addForeignKeyConstraint:
            baseTableName: listings
            baseColumnNames: application_id
            referencedTableName: property_applications
            referencedColumnNames: id
            constraintName: fk_listings_application
        - addForeignKeyConstraint:
            baseTableName: listings
            baseColumnNames: decision_id
            referencedTableName: admin_decisions
            referencedColumnNames: id
            constraintName: fk_listings_decision
        - addForeignKeyConstraint:
            baseTableName: terms_consents
            baseColumnNames: application_id
            referencedTableName: property_applications
            referencedColumnNames: id
            constraintName: fk_terms_consents_application
        - addForeignKeyConstraint:
            baseTableName: terms_consents
            baseColumnNames: user_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_terms_consents_user
        - addForeignKeyConstraint:
            baseTableName: terms_consents
            baseColumnNames: terms_definition_id
            referencedTableName: terms_definitions
