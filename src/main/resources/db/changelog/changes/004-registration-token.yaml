databaseChangeLog:
  - changeSet:
      id: 004-registration-token
      author: home-rental-service
      changes:

        # username and hashed_password are now set in the complete-registration
        # step, so they must be nullable until the user finishes signing up.
        - dropNotNullConstraint:
            tableName: auth_users
            columnName: username
            columnDataType: VARCHAR(100)

        - dropNotNullConstraint:
            tableName: auth_users
            columnName: hashed_password
            columnDataType: VARCHAR(255)

        # Stores SHA-256 hash of the short-lived token returned by /auth/verify-otp.
        # Cleared once /auth/complete-registration succeeds.
        - addColumn:
            tableName: auth_users
            columns:
              - column:
                  name: registration_token
                  type: VARCHAR(64)
              - column:
                  name: registration_token_expires_at
                  type: TIMESTAMP WITH TIME ZONE
