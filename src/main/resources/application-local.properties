# application-local.properties — LOCAL DEV profile
# Active when: SPRING_PROFILES_ACTIVE=local (or by default)
# SAFE TO COMMIT — contains only local dev values, no real secrets.

# ── DataSource — local Docker Compose postgres ────────────
spring.datasource.url=jdbc:postgresql://db:5432/home_rental_db
spring.datasource.username=appuser
spring.datasource.password=changeme

# ── JPA / Hibernate ───────────────────────────────────────
# Liquibase owns the schema — Hibernate must not attempt DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── OTP ───────────────────────────────────────────────────
# Fixed OTP for local/testing. Remove or leave blank in production.
otp.fixed-value=111111

# ── Logging ───────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.bokl.homerental=DEBUG

# ── Error responses — full details locally ────────────────
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# ── Actuator — expose all endpoints locally ───────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
