services:

  # ── Application container ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-rental-service-app
    ports:
      - "8080:8080"
    environment:
      # Defaults to "local". Override with: SPRING_PROFILES_ACTIVE=prod ./start.sh
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/home_rental_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: changeme
      JWT_SECRET: ${JWT_SECRET:-xbBPqZAxi5mEfhkrQGm1z2MvNOQcYkkaisktXr15CAk=}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - home-rental-service-net
    restart: on-failure

  # ── PostgreSQL container ──────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: home-rental-service-db
    environment:
      POSTGRES_DB: home_rental_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - home-rental-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d home_rental_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - home-rental-service-net
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────
volumes:
  home-rental-service-db-data:

# ── Networks ──────────────────────────────────────────────
networks:
  home-rental-service-net:
    driver: bridge
