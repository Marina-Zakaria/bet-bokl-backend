# ── Application identity ─────────────────────────────────
spring.application.name=home-rental-service

# ── Default profile: local is active when no env var overrides it
# Override with:  SPRING_PROFILES_ACTIVE=prod
# The env var always wins over this property file value.
spring.profiles.active=local

# ── Server ────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── JDBC driver (shared across all profiles) ──────────────
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ─────────────────────────────────────────────────────
spring.jpa.open-in-view=false

# ── Liquibase ────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ── JWT ──────────────────────────────────────────────────────
# Secret MUST be supplied via environment variable.
# Must decode to at least 32 bytes (256 bits) for HS256.
# Generate one: openssl rand -base64 32
jwt.secret=${JWT_SECRET:xbBPqZAxi5mEfhkrQGm1z2MvNOQcYkkaisktXr15CAk=}

# ── RSA field encryption ──────────────────────────────────────
# Clients encrypt password/otp with the public key before sending.
# Fetch the public key via GET /auth/public-key.
# Leave blank → key pair is generated ephemerally on startup (dev/test).
# For production: generate with openssl and set both env vars.
#   openssl genrsa -out rsa_private.pem 2048
#   openssl pkcs8 -topk8 -nocrypt -in rsa_private.pem -outform DER | base64 -w0
#   openssl rsa -in rsa_private.pem -pubout -outform DER | base64 -w0
rsa.private-key=${RSA_PRIVATE_KEY:}
rsa.public-key=${RSA_PUBLIC_KEY:}
jwt.token-type=Bearer

# ── Logging ─────────────────────────────────────────────────
# Spring Boot 3.3 adds [app-name] to every log line by default — suppress it.
# The prod JSON encoder already includes the service name as a structured field.
logging.include-application-name=false

# ── Error handling ───────────────────────────────────────────
# Throw NoHandlerFoundException on 404 so @RestControllerAdvice intercepts it.
# Disables static resource mapping — correct for pure API services.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
