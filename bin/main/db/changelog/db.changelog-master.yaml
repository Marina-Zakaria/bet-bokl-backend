# Liquibase master changelog — home-rental-service
# Destination: src/main/resources/db/changelog/db.changelog-master.yaml
#
# This is the entry point Liquibase reads on every application startup.
# Include migration files in explicit, numbered order.
#
# To add a migration:
#   1. Create src/main/resources/db/changelog/changes/NNN-description.yaml
#   2. Add a new "- include:" entry at the bottom of this file.
#
# Rules:
#   - Never reorder or remove existing entries.
#   - Use classpath-root-relative paths (db/changelog/changes/...).

databaseChangeLog:
  - include:
      file: db/changelog/changes/001-auth-schema.yaml
  - include:
      file: db/changelog/changes/002-seed-roles.yaml
  - include:
      file: db/changelog/changes/003-seed-app-config.yaml
  - include:
      file: db/changelog/changes/004-registration-token.yaml
  - include:
      file: db/changelog/changes/005-create-governorates-areas.yaml
  - include:
      file: db/changelog/changes/006-create-listing-inspection-tables.yaml
  - include:
      file: db/changelog/changes/007-add-listing-inspection-indexes.yaml
