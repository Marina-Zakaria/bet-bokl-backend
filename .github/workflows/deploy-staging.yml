name: Deploy staging to EC2

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend tests
        run: ./gradlew clean test

      - name: Verify staging Docker image
        run: docker build --tag home-rental-service:staging .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_staging
          chmod 600 ~/.ssh/ec2_staging
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull staging and deploy containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          ssh -i ~/.ssh/ec2_staging "${EC2_USER}@${EC2_HOST}" \
            "EC2_APP_PATH='${EC2_APP_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$EC2_APP_PATH"
          git fetch origin staging
          git switch staging
          git pull --ff-only origin staging
          docker compose --env-file .env.staging \
            -f docker-compose.staging.yml \
            up -d --build --remove-orphans
          docker image prune -f
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env.staging \
            -f docker-compose.staging.yml logs --no-color app
          exit 1
          REMOTE
