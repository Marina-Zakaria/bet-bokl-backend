services:
  db:
    image: postgres:16-alpine
    container_name: bokl-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - bokl-staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bokl-staging

  app:
    # Built on your machine / CI and pushed to Docker Hub — never build on t3.micro.
    image: ${APP_IMAGE:-essamfakher5/bet-bokl-backend:staging}
    container_name: bokl-staging-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,staging
      SERVER_PORT: 8080
      # Keep the JVM small on t3.micro (1 GB RAM shared with Postgres).
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=50.0 -Xms128m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Optional — if empty, the app generates ephemeral RSA keys on startup
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:-}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS is required}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required for presigned uploads}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for presigned uploads}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for presigned uploads}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_S3_PRESIGN_EXPIRATION_SECONDS: ${AWS_S3_PRESIGN_EXPIRATION_SECONDS:-900}
      BOOKING_APPROVAL_EXPIRATION_CRON: ${BOOKING_APPROVAL_EXPIRATION_CRON:-0 5 0 * * *}
      TZ: ${TZ:-Africa/Cairo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - bokl-staging

volumes:
  bokl-staging-postgres-data:
    name: bokl-staging-postgres-data

networks:
  bokl-staging:
    name: bokl-staging
